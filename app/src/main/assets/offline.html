<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>No Connection</title>
<style>
  :root {
    --text-primary: #1c1c1e;
    --text-secondary: #636366;
    --border-strong: #c6c6c8;
    --surface-1: #f2f2f7;
    --accent: #2e75b6;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --text-primary: #f2f2f7;
      --text-secondary: #a1a1a6;
      --border-strong: #38383a;
      --surface-1: #2c2c2e;
    }
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100dvh;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .container {
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    text-align: center;
    padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(32px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* Fluid & enlarged bird wrapper */
  .bird-wrap {
    position: relative;
    width: clamp(210px, 55vw, 290px);
    aspect-ratio: 1 / 1;
    margin: 0 auto;
  }

  .bird-wrap svg {
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible;
  }

  /* Tears locked to percentages so they stay aligned at any screen size */
  .tear {
    position: absolute;
    width: 3.75%;
    height: 6.25%;
    border-radius: 50% 50% 60% 60%;
    animation: fall 1.2s infinite;
    opacity: 0;
    pointer-events: none;
  }
  .tear1 {
    background: #74b9ff;
    left: 23.75%;
    top: 38.75%;
    animation-delay: 0s;
  }
  .tear2 {
    background: #74b9ff;
    left: 32.5%;
    top: 36.25%;
    animation-delay: 0.5s;
  }

  @keyframes fall {
    0%   { opacity: 0; transform: translateY(0); }
    20%  { opacity: 1; }
    80%  { opacity: 1; }
    100% { opacity: 0; transform: translateY(180%); }
  }

  /* Page flip */
  .page {
    transform-origin: left center;
    animation: flip 0.9s infinite ease-in-out;
  }
  @keyframes flip {
    0%   { transform: rotateY(0deg); opacity: 1; }
    45%  { transform: rotateY(-80deg); opacity: 0.3; }
    50%  { transform: rotateY(-80deg); opacity: 0.3; }
    100% { transform: rotateY(0deg); opacity: 1; }
  }

  /* Wing flap */
  .wing {
    transform-origin: 80% 50%;
    animation: flap 0.9s infinite ease-in-out;
  }
  @keyframes flap {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(-18deg); }
  }

  /* Scalable typography */
  .message {
    margin-top: clamp(20px, 4.5vw, 32px);
    color: var(--text-primary);
    font-size: clamp(1.25rem, 5vw, 1.65rem);
    font-weight: 600;
    letter-spacing: -0.015em;
  }

  .sub {
    color: var(--text-secondary);
    font-size: clamp(0.95rem, 3.8vw, 1.12rem);
    margin-top: 8px;
    max-width: 320px;
    line-height: 1.45;
  }

  /* Touch-friendly, accessible button */
  button {
    margin-top: clamp(24px, 5vw, 36px);
    min-height: 48px;
    min-width: 150px;
    padding: 12px 36px;
    border: 1px solid var(--border-strong);
    background: transparent;
    border-radius: 12px;
    font-size: clamp(1rem, 4vw, 1.15rem);
    font-weight: 600;
    color: var(--text-primary);
    cursor: pointer;
    transition: transform 0.15s ease, background 0.2s ease, opacity 0.2s ease;
  }

  button:hover {
    background: var(--surface-1);
  }

  button:active {
    transform: scale(0.96);
    opacity: 0.8;
  }
</style>
</head>
<body>
<div class="container">
  <div class="bird-wrap">
    <!-- Tears -->
    <div class="tear tear1"></div>
    <div class="tear tear2"></div>

    <svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
      <!-- Book base -->
      <rect x="22" y="100" width="116" height="50" rx="4" fill="#c0985b"/>
      <!-- Book spine -->
      <rect x="76" y="100" width="8" height="50" fill="#a07840"/>
      <!-- Left page -->
      <rect x="26" y="104" width="48" height="43" rx="2" fill="#fdf6e3"/>
      <!-- Right page -->
      <rect x="86" y="104" width="48" height="43" rx="2" fill="#faf0d0"/>
      <!-- Page lines left -->
      <line x1="32" y1="114" x2="70" y2="114" stroke="#d4c8a0" stroke-width="1"/>
      <line x1="32" y1="120" x2="70" y2="120" stroke="#d4c8a0" stroke-width="1"/>
      <line x1="32" y1="126" x2="70" y2="126" stroke="#d4c8a0" stroke-width="1"/>
      <line x1="32" y1="132" x2="70" y2="132" stroke="#d4c8a0" stroke-width="1"/>
      <line x1="32" y1="138" x2="70" y2="138" stroke="#d4c8a0" stroke-width="1"/>
      <!-- Page lines right -->
      <line x1="90" y1="114" x2="128" y2="114" stroke="#d4c8a0" stroke-width="1"/>
      <line x1="90" y1="120" x2="128" y2="120" stroke="#d4c8a0" stroke-width="1"/>
      <line x1="90" y1="126" x2="128" y2="126" stroke="#d4c8a0" stroke-width="1"/>
      <line x1="90" y1="132" x2="128" y2="132" stroke="#d4c8a0" stroke-width="1"/>
      <line x1="90" y1="138" x2="128" y2="138" stroke="#d4c8a0" stroke-width="1"/>

      <!-- Flipping page (animated) -->
      <g class="page" style="transform-box:fill-box;">
        <rect x="76" y="104" width="48" height="43" rx="2" fill="#e8ddb5" opacity="0.9"/>
        <line x1="80" y1="114" x2="120" y2="114" stroke="#bfb080" stroke-width="1"/>
        <line x1="80" y1="120" x2="120" y2="120" stroke="#bfb080" stroke-width="1"/>
        <line x1="80" y1="126" x2="120" y2="126" stroke="#bfb080" stroke-width="1"/>
      </g>

      <!-- Bird body -->
      <ellipse cx="80" cy="75" rx="30" ry="26" fill="#4a90d9"/>
      <!-- Bird belly -->
      <ellipse cx="80" cy="80" rx="18" ry="16" fill="#eaf4ff"/>
      <!-- Wing (left, animated) -->
      <g class="wing" style="transform-box:fill-box;">
        <ellipse cx="58" cy="75" rx="18" ry="12" fill="#3a78c0" transform="rotate(-10 58 75)"/>
      </g>
      <!-- Wing tip lines -->
      <line x1="48" y1="72" x2="42" y2="78" stroke="#2a5fa0" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="50" y1="76" x2="44" y2="82" stroke="#2a5fa0" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Right wing -->
      <ellipse cx="102" cy="75" rx="18" ry="12" fill="#3a78c0" transform="rotate(10 102 75)"/>

      <!-- Head -->
      <ellipse cx="80" cy="50" rx="22" ry="20" fill="#4a90d9"/>
      <!-- Tuft -->
      <ellipse cx="80" cy="32" rx="8" ry="10" fill="#3a78c0" transform="rotate(-5 80 32)"/>
      <ellipse cx="72" cy="33" rx="5" ry="8" fill="#2a68a9" transform="rotate(-20 72 33)"/>

      <!-- Eye white -->
      <circle cx="74" cy="48" r="7" fill="white"/>
      <!-- Eye -->
      <circle cx="74" cy="48" r="4.5" fill="#1a1a1a"/>
      <!-- Pupil highlight -->
      <circle cx="75.5" cy="46.5" r="1.5" fill="white"/>
      <!-- Sad eyebrow -->
      <path d="M68 42 Q74 40 80 43" stroke="#2a5fa0" stroke-width="2" fill="none" stroke-linecap="round"/>

      <!-- Beak -->
      <path d="M62 54 L54 58 L62 60 Z" fill="#f0b429"/>
      <!-- Mouth frown -->
      <path d="M62 58 Q58 62 56 60" stroke="#d09010" stroke-width="1.5" fill="none" stroke-linecap="round"/>

      <!-- Feet on book -->
      <line x1="72" y1="100" x2="68" y2="105" stroke="#f0b429" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="80" y1="100" x2="80" y2="105" stroke="#f0b429" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="88" y1="100" x2="92" y2="105" stroke="#f0b429" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Toe nails -->
      <line x1="68" y1="105" x2="64" y2="105" stroke="#f0b429" stroke-width="2" stroke-linecap="round"/>
      <line x1="68" y1="105" x2="68" y2="108" stroke="#f0b429" stroke-width="2" stroke-linecap="round"/>
      <line x1="80" y1="105" x2="76" y2="105" stroke="#f0b429" stroke-width="2" stroke-linecap="round"/>
      <line x1="80" y1="105" x2="80" y2="108" stroke="#f0b429" stroke-width="2" stroke-linecap="round"/>
      <line x1="92" y1="105" x2="96" y2="105" stroke="#f0b429" stroke-width="2" stroke-linecap="round"/>
      <line x1="92" y1="105" x2="92" y2="108" stroke="#f0b429" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </div>

  <div class="message">No internet connection</div>
  <div class="sub">Check your connection and try again</div>
  
  <button onclick="handleReload()">Retry</button>
</div>

<script>
  function handleReload() {
    if (window.median && window.median.webview && typeof window.median.webview.reload === 'function') {
      window.median.webview.reload();
    } else if (window.gonative && window.gonative.webview && typeof window.gonative.webview.reload === 'function') {
      window.gonative.webview.reload();
    } else {
      window.location.reload();
    }
  }
</script>
</body>
</html>
